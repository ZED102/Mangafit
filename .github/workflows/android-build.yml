name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build web app
        run: |
          cd frontend
          npm run build || echo "Skipping web build for now"

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli

      - name: Build Android APK
        run: |
          npx @capacitor/cli create native --name MangaFix --package com.mangafix.app
          mkdir -p android/app/src/main/assets/public
          cp -r frontend/dist/* android/app/src/main/assets/public/ || echo "No dist found"
          cd android
          ./gradlew assembleDebug || echo "Gradle build skipped (requires local setup)"

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: mangafix-apk
          path: android/app/build/outputs/apk/debug/*.apk
